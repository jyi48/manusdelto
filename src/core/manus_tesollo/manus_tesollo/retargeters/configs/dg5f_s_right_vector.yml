# DG5F-S variant of dg5f_right_vector.yml -- generated by name
# substitution, so the tuned values and the vector families below are
# the M's. Joint limits come from dg5f_s_right_retarget.urdf, which
# carries ergo's S_JOINT_LIMITS: the S stops short of the M and the
# optimizer bounds are the URDF limits, so the M file would let dex
# solve past the stop. scaling_factor/low_pass_alpha are unverified on
# the S -- they were tuned on an M.
retargeting:
  type: vector
  # dex-only retarget variant (PIP/DIP lower bound pinned to 0). See the
  # matching dexpilot config for the rationale.
  urdf_path: dg5f_s_right_retarget.urdf

  # All 20 revolute joints in DG5F command order; output qpos is reordered to
  # this order in dex.py.
  target_joint_names: [
    'joint_1_1', 'joint_1_2', 'joint_1_3', 'joint_1_4',
    'joint_2_1', 'joint_2_2', 'joint_2_3', 'joint_2_4',
    'joint_3_1', 'joint_3_2', 'joint_3_3', 'joint_3_4',
    'joint_4_1', 'joint_4_2', 'joint_4_3', 'joint_4_4',
    'joint_5_1', 'joint_5_2', 'joint_5_3', 'joint_5_4',
  ]

  # Vector families:
  #   A. palm -> fingertip  (tip position, like DexPilot)          [5 vectors]
  #   B. MCP  -> DIP         (distal-segment DIRECTION, fingers)    [4 vectors]
  #   B'. thumb link_1_2 -> link_1_3 (thumb PROXIMAL direction)  [1 vector]
  #   C. palm -> thumb link_1_2  (thumb BASE direction)           [1 vector]
  #   D. thumb link_1_3 -> link_1_tip (thumb DISTAL direction)   [1 vector]
  #
  # The plain A+B setup left the thumb L-shaped: B's thumb vector sat entirely
  # past joints 1_1 (abduction) and 1_2 (opposition) so the base never moved,
  # and it spanned both curl joints while matching only the human proximal
  # segment, so all curl piled into 1_3 (PIP over-bends, DIP straight). Fix:
  #   C  spans palm -> link_1_2 (past 1_1/1_2), matched to the human wrist->
  #      thumb-MCP direction, so abduction+opposition are actually driven.
  #   B' spans link_1_2 -> link_1_3 (joint 1_3 only, human proximal 2->3).
  #   D  spans link_1_3 -> link_1_tip (joint 1_4 only, human distal 3->4).
  # Now each thumb joint owns one direction target with a matching human
  # segment. Tuned on the manusdelto bench rig (2026-07-07). The library has no
  # per-vector weight; duplicate an entry across all four lists to weight it.
  target_origin_link_names:
    - "link_base"
    - "link_base"
    - "link_base"
    - "link_base"
    - "link_base"
    - "link_1_2"
    - "link_2_2"
    - "link_3_2"
    - "link_4_2"
    - "link_5_2"
    - "link_base"      # C: thumb base
    - "link_1_3"       # D: thumb distal
  target_task_link_names:
    - "link_1_tip"
    - "link_2_tip"
    - "link_3_tip"
    - "link_4_tip"
    - "link_5_tip"
    - "link_1_3"       # B': thumb proximal
    - "link_2_4"
    - "link_3_4"
    - "link_4_4"
    - "link_5_4"
    - "link_1_2"       # C: thumb base
    - "link_1_tip"     # D: thumb distal
  # Human (MANO) keypoint indices for each vector: [origins; tasks].
  #   origins: wrist x5, thumb MCP / finger PIP knuckles x5, wrist (C), thumb PIP (D)
  #   tasks:   tip x5,   thumb PIP / finger DIP joints x5,   thumb MCP (C), thumb tip (D)
  target_link_human_indices:
    - [0, 0, 0, 0, 0, 2, 6, 10, 14, 18, 0, 3]
    - [4, 8, 12, 16, 20, 3, 7, 11, 15, 19, 2, 4]

  # Kept in step with the dexpilot configs (hardware-tuned 2026-07-07).
  scaling_factor: 1.1
  low_pass_alpha: 0.1

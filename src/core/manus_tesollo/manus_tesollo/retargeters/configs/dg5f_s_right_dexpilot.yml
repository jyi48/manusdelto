# DG5F-S variant of dg5f_right_dexpilot.yml -- generated by name
# substitution, so the tuned values and the vector families below are
# the M's. Joint limits come from dg5f_s_right_retarget.urdf, which
# carries ergo's S_JOINT_LIMITS: the S stops short of the M and the
# optimizer bounds are the URDF limits, so the M file would let dex
# solve past the stop. scaling_factor/low_pass_alpha are unverified on
# the S -- they were tuned on an M.
retargeting:
  type: DexPilot
  # dex-only retarget variant: PIP/DIP lower bound pinned to 0 (thumb one-sided)
  # so the optimizer can't drive fingers backward. Base dg5f_right.urdf is the
  # true hardware description; only dex uses this constrained copy.
  urdf_path: dg5f_s_right_retarget.urdf

  # All 20 revolute joints, in DG5F command order (finger 1=thumb .. 5=pinky,
  # joint 1..4 proximal->distal). Output qpos is reordered to this order in dex.py.
  target_joint_names: [
    'joint_1_1', 'joint_1_2', 'joint_1_3', 'joint_1_4',
    'joint_2_1', 'joint_2_2', 'joint_2_3', 'joint_2_4',
    'joint_3_1', 'joint_3_2', 'joint_3_3', 'joint_3_4',
    'joint_4_1', 'joint_4_2', 'joint_4_3', 'joint_4_4',
    'joint_5_1', 'joint_5_2', 'joint_5_3', 'joint_5_4',
  ]

  # Robot wrist/palm root and the five fingertips (thumb, index, middle, ring, pinky).
  wrist_link_name: "link_base"
  finger_tip_link_names: [ "link_1_tip", "link_2_tip", "link_3_tip", "link_4_tip", "link_5_tip" ]

  # Human->robot hand size ratio. Hardware-tuned on the manusdelto bench rig
  # (2026-07-07); was 1.2.
  scaling_factor: 1.1

  # Smaller alpha = stronger low-pass smoothing (more latency). Hardware-tuned
  # (2026-07-07); was 0.2.
  low_pass_alpha: 0.1
